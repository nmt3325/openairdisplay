name: OpenAirDisplay release
run-name: OpenAirDisplay ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    # Fork tags are the upstream version this build is based on, plus -air,
    # and optionally a fork revision for changes that ship between upstream
    # releases: v1.25.0-air, v1.25.0-air.2, v1.25.0-air.3, ...
    tags: ['v*-air', 'v*-air.*']
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA (blank uses the selected ref)
        type: string
      app_version:
        description: Numeric app version (blank uses config.json)
        type: string
      release_tag:
        description: New release tag (upstream version + -air, plus .2, .3 ... for a fork revision)
        required: true
        default: v1.25.0-air.2
        type: string
      publish:
        description: Publish release and update feeds after verification
        default: true
        type: boolean
      prerelease:
        description: Publish as a pre-release, kept apart from the main release
        default: true
        type: boolean

permissions:
  contents: read
concurrency:
  group: openairdisplay-fork-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      app_version: ${{ steps.resolve.outputs.app_version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - id: resolve
        env:
          REQUESTED_VERSION: ${{ inputs.app_version }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == nmt3325/openairdisplay ]]
          version="${REQUESTED_VERSION:-$(python3 -c 'import json; print(json.load(open(".github/fork-release/config.json"))["appVersion"])')}"
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # The tag names the upstream release this build is based on
          # (v1.25.0-air), with an optional fork revision for a second release
          # off that same base (v1.25.0-air.2). The upstream number never moves
          # for a revision: there is no such upstream release to point at.
          [[ "$tag" == "v$version-air" || "$tag" =~ ^v${version//./\\.}-air\.([2-9]|[1-9][0-9]+)$ ]]
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "app_version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, iOS]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Import persistent signing identity and update key
        if: matrix.platform == 'macOS'
        env:
          MAC_P12: ${{ secrets.OPENAIRDISPLAY_MAC_SIGNING_P12 }}
          MAC_P12_PASSWORD: ${{ secrets.OPENAIRDISPLAY_MAC_SIGNING_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.OPENAIRDISPLAY_SPARKLE_PRIVATE_KEY }}
        run: bash .github/fork-release/setup-signing.sh
      - name: Build, sign and verify release artifacts
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          APP_BUILD_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          PLATFORM: ${{ matrix.platform }}
        run: bash .github/fork-release/build.sh "$PLATFORM"
      - uses: actions/upload-artifact@v4
        with:
          name: fork-release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fork-release-logs-${{ matrix.platform }}
          path: ${{ runner.temp }}/openairdisplay-*.log
          if-no-files-found: ignore
          overwrite: true
      - name: Remove temporary private keys
        if: always() && matrix.platform == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/openairdisplay-private/signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/openairdisplay-private"
  publish:
    needs: [prepare, build]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: fork-release-*
          merge-multiple: true
          path: release-assets
      - name: Publish verified fork release and signed update feeds
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          APP_BUILD_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          # Blank on a tag push, which carries no inputs: publish.py reads
          # anything but an explicit false as a pre-release, so only a
          # deliberate run with the box cleared can move the main release.
          # Comparing the input against false here cannot work, because an
          # expression casts an absent input to false as well.
          PRERELEASE: ${{ inputs.prerelease }}
        run: python3 .github/fork-release/publish.py release-assets
