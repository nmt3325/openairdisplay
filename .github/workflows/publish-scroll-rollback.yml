# One-shot rollback release; removed once update feeds are verified.
name: Publish scroll rollback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-scroll-rollback.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch stable OpenAirDisplay v1.25.0-air.19
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v1.25.0-air.19
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; then
            echo "::notice::Release $tag already exists"
            exit 0
          fi
          gh workflow run fork-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_sha="$GITHUB_SHA" \
            -f app_version=1.25.0 \
            -f release_tag="$tag" \
            -f publish=true \
            -f prerelease=false
